name: dependabot-automerge

on: pull_request_target # zizmor: ignore[dangerous-triggers]

permissions: {}

jobs:
  automerge:
    # Never checks out or runs PR code; it only enables auto-merge, which GitHub
    # defers until the required status checks on main pass.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Grouped PRs carry several dependencies, so check every entry rather than the
      # single top-level outputs. Fails closed: anything unexpected means no merge.
      # Only direct uv dev-dependency patch/minor updates are merged; runtime and
      # transitive dependencies, majors and every GitHub Actions PR stay open.
      - id: decide
        env:
          UPDATED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          if jq -e '
            length > 0 and all(
              .dependencyType == "direct:development"
              and (.updateType | IN("version-update:semver-patch", "version-update:semver-minor"))
              and .packageEcosystem == "uv"
            )
          ' <<< "$UPDATED_DEPENDENCIES" > /dev/null; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "merge=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not a uv dev-dependency patch/minor update; leaving the PR open for review"
          fi

      - if: steps.decide.outputs.merge == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
